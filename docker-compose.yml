# Self-hosted maps POC — Valhalla (matrix/routing) + FastAPI adapter
#
# Dùng ghcr.io/valhalla/valhalla-scripted:latest — image tự build graph từ
# *.osm.pbf trong /custom_files rồi serve /sources_to_targets (matrix),
# costing=motor_scooter. Env chi tiết: docker/README.md của valhalla.
#
# Cách dùng:
#   cp .env.example .env
#   make download-osm        # tải vietnam-latest.osm.pbf vào data/custom_files
#   make up                  # build graph lần đầu 10-30 phút
#   make benchmark           # so sánh Valhalla vs Vietmap

services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: vucar-valhalla
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data/custom_files:/custom_files
    environment:
      - build_admins=true
      - build_time_zones=true
      - build_elevation=false
      - server_threads=4
      - serve_tiles=True
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/status || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 90
      start_period: 1500s  # lần đầu build graph VN 10-30 phút
    deploy:
      resources:
        limits:
          memory: 6G

  adapter:
    build: ./adapter
    container_name: vucar-maps-adapter
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - VALHALLA_URL=http://valhalla:8002
      - VIETMAP_API_KEY=${VIETMAP_API_KEY:-}
    depends_on:
      valhalla:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
